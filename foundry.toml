[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["node_modules", "lib"]
test = "contracts/test"
script = "contracts/script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.robinhood.com"
